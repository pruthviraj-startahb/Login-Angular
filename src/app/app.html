<div class="container">
  <h1>Login Form</h1>

  <form (ngSubmit)="onLogin()">
    <input
      type="email"
      name="email"
      id="email"
      class="pad"
      [(ngModel)]="email"
      placeholder="UserName"
    />
    <br />
    <input
      type="password"
      name="pass"
      id="pass"
      class="pad"
      [(ngModel)]="pass"
      placeholder="Password"
    />
    <br />
    <button type="submit" class="pad">Submit</button>
  </form>
</div>
